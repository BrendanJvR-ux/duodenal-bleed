<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duodenal Bleed tests</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;background:#0b0f13;color:#e8eef2;margin:0;padding:16px;max-width:760px}
h1{font-size:18px} .sum{font-weight:700;margin:8px 0 14px}
.t{padding:4px 8px;border-left:4px solid #5fd38d;background:#131a20;margin:4px 0}
.t.fail{border-color:#ff5d57} .t small{display:block;color:#ff9a96;white-space:pre-wrap}
iframe{position:absolute;left:-9999px;width:900px;height:1200px;border:0}
</style>
</head>
<body>
<h1>Duodenal Bleed: end-to-end tests</h1>
<div class="sum" id="sum">Running…</div>
<div id="out"></div>
<iframe id="g" src="../index.html?nopause=1"></iframe>
<script>
// Drives the real game page through real KeyboardEvents (arrows, Space, Enter, P, R) and advances the
// simulation deterministically with __duo.tick(), so every check below uses only the five play keys.
const frame = document.getElementById('g');
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: e.message || String(e) }); }
}
function eq(a, b, msg) { if (a !== b) throw new Error((msg || 'expected equal') + `: got ${JSON.stringify(a)}, wanted ${JSON.stringify(b)}`); }
function ok(c, msg) { if (!c) throw new Error(msg || 'expected truthy'); }

frame.addEventListener('load', () => {
  const w = frame.contentWindow, D = w.__duo, doc = w.document;
  D.manual(true);
  const KEYS = { up: ['ArrowUp', 'ArrowUp'], down: ['ArrowDown', 'ArrowDown'], left: ['ArrowLeft', 'ArrowLeft'], right: ['ArrowRight', 'ArrowRight'],
    next: ['Tab', 'Tab'], prev: ['Tab', 'Tab', true], use: [' ', 'Space'], enter: ['Enter', 'Enter'], p: ['p', 'KeyP'], r: ['r', 'KeyR'] };
  // 'next' = Tab, 'prev' = Shift+Tab
  const k = (name, type, repeat = false) => { const [key, code, shiftKey] = KEYS[name]; const e = new w.KeyboardEvent(type, { key, code, shiftKey: !!shiftKey, repeat, bubbles: true, cancelable: true }); w.dispatchEvent(e); return e.defaultPrevented; };
  const S = () => D.snapshot(), tick = s => D.tick(s);
  const dist = () => { const l = S().lesion; return l.vis ? Math.hypot(l.x - tip.x, l.y - tip.y) : Infinity; };
  const hold = (n, sec) => { k(n, 'keydown'); tick(sec); k(n, 'keyup'); };
  const tap = n => { k(n, 'keydown'); k(n, 'keyup'); };
  const tip = { x: 410, y: 420 };
  // aim with short arrow taps only: ↑/↓ set the depth (lesion's vertical position), ←/→ steer it sideways onto the tip
  const align = () => { let n = 0; while (dist() > 8 && n++ < 120) {
    const l = S().lesion, ey = l.y - tip.y, ex = l.x - tip.x, keys = [];
    if (Math.abs(ey) > 5) keys.push(ey < 0 ? 'up' : 'down'); if (Math.abs(ex) > 5) keys.push(ex > 0 ? 'right' : 'left');
    keys.forEach(x => k(x, 'keydown')); tick(Math.min(0.25, Math.max(0.04, Math.max(Math.abs(ey), Math.abs(ex)) / 600))); keys.forEach(x => k(x, 'keyup')); tick(0.45); } };
  const fresh = (i = 2) => { D.loadCase(i, true); };          // case 0 varices, 1 gastric ulcer, 2 duodenal ulcer (default)
  const badge = () => doc.getElementById('dbBadge').textContent;

  test('starts in the duodenum, live, with a blood trail and an active bleed', () => {
    D.loadCase(2, false); eq(S().state, 'intro'); ok(S().totalBlood > 5, 'trail blood present before start');
    k('use', 'keydown'); k('use', 'keyup'); eq(S().state, 'play'); eq(S().tool, 'wash', 'starts on Wash');
    ok(S().bleeding, 'bleeding'); ok(S().lesion.d > 2 && S().lesion.d < 5, 'lesion a short way ahead'); eq(S().region, 'd1', 'case 3 starts in the duodenal bulb');
  });
  test('arrows, Tab and Space are default-prevented during play (no page scroll or focus jump)', () => {
    fresh(); for (const n of ['up', 'down', 'left', 'right', 'next', 'prev', 'use']) { ok(k(n, 'keydown'), n + ' keydown'); ok(k(n, 'keyup'), n + ' keyup'); }
  });
  test('Up/Down move the scope; releasing stops it', () => {
    fresh(); const z0 = S().z; hold('up', 1); const z1 = S().z; ok(z1 > z0 + 0.4, 'moved forward'); tick(1); const z2 = S().z; tick(0.5); eq(S().z, z2, 'stopped after release');
    hold('down', 1); ok(S().z < z2, 'moved back');
  });
  test('the scope cannot pass beyond the first part of the duodenum', () => {
    fresh(); k('up', 'keydown'); tick(30); k('up', 'keyup'); eq(S().z, D.ANATOMY.scopeMax, 'stopped at the end of D1'); eq(S().region, 'd1');
    ok(D.ANATOMY.scopeMax < D.ANATOMY.end, 'stops short of the superior duodenal flexure');
    ok(/beyond the first part of the duodenum/.test(doc.getElementById('cue').textContent), 'cue explains the limit');
  });
  test('the whole tract is walkable: D1 → pylorus → antrum → body → GOJ → oesophagus, depth in cm only increases with z', () => {
    fresh(); const seen = [S().region]; let lastCm = S().cm; k('down', 'keydown');
    for (let i = 0; i < 2400 && S().z > 0; i++) { tick(1 / 20); const r = S().region; if (seen[seen.length - 1] !== r) seen.push(r); ok(S().cm <= lastCm, 'cm decreases as we withdraw'); lastCm = S().cm; }
    k('down', 'keyup'); eq(seen.join('>'), 'd1>antrum>body>cardia>oes', 'regions in anatomical order'); eq(S().z, 0); ok(/20 cm|goes no higher/.test(doc.getElementById('cue').textContent), 'upper limit cue');
  });
  test('each case starts in its own region: oesophagus, stomach, duodenum', () => {
    fresh(0); eq(S().region, 'oes'); fresh(1); eq(S().region, 'body'); fresh(2); eq(S().region, 'd1');
  });
  test('lesions sit in the right organs: varices in the oesophagus, ulcers in stomach and duodenum', () => {
    const [v, g, du] = [0, 1, 2].map(i => { D.loadCase(i, true); return D.CASE; }), reg = w => D.ANATOMY.regions.find(r => w < r.to).id;
    eq(v.lesion.kind, 'varix'); eq(reg(v.lesion.w), 'oes'); eq(g.lesion.kind, 'ulcer'); ok(['cardia', 'body', 'antrum'].includes(reg(g.lesion.w)), 'gastric ulcer in the stomach');
    eq(du.lesion.kind, 'ulcer'); eq(reg(du.lesion.w), 'd1'); ok(du.lesion.w < D.ANATOMY.scopeMax, 'duodenal ulcer reachable within D1');
    ok(v.suitable.banding && !v.suitable.cautery && g.suitable.cautery && !g.suitable.banding && du.suitable.cautery && !du.suitable.banding, 'banding for varices, cautery for ulcers');
  });
  test('crossing a landmark names it', () => {
    fresh(); k('down', 'keydown'); let seen = false; for (let i = 0; i < 600 && !seen; i++) { tick(1 / 20); seen = /Pylorus/.test(doc.getElementById('cue').textContent); } k('down', 'keyup'); ok(seen, 'pylorus cue');
  });
  test('a very quick tap still moves the scope a little', () => {
    fresh(); tap('up'); tick(0.5); ok(S().z > 0.01, 'tap moved'); tap('right'); tick(0.5); ok(S().steer > 0.005, 'steer tap moved');
  });
  test('Left/Right steer the scope: tissue shifts sideways, limits hold, and they do not change tools', () => {
    fresh(); const x0 = S().lesion.x; hold('right', 1); tick(1); ok(S().steer > 0.3, 'steered right'); ok(S().lesion.x < x0 - 40, 'tissue moved left on screen');
    eq(S().tool, 'wash', 'Right arrow does not change the tool'); hold('left', 6); ok(S().steer < -0.7, 'steered fully left'); ok(S().steer >= -w.__duo.CONFIG.steerMax - 1e-9, 'left limit');
    ok(S().lesion.x > x0, 'tissue moved right on screen'); eq(S().tool, 'wash', 'Left arrow does not change the tool');
    eq(S().z, D.CASE.start.z, 'steering does not move the scope along the lumen');
  });
  test('aiming needs both axes: correct depth alone is not enough, steering finishes the job', () => {
    fresh(); let n = 0; while (Math.abs(S().lesion.y - tip.y) > 4 && n++ < 100) { const key = S().lesion.y < tip.y ? 'up' : 'down'; k(key, 'keydown'); tick(0.05); k(key, 'keyup'); tick(0.4); }
    ok(dist() > 30, 'lesion beside the tip at the right depth, not under it (' + dist().toFixed(0) + ' px)');
    ok(S().lesion.x > tip.x, 'it sits to the right, so steer right'); align(); ok(dist() <= 8, 'steered onto the tip'); ok(S().steer > 0.1, 'by steering right');
  });
  test('Tab cycles Wash→Cautery→Banding→Wash, one step per keypress even when held; Shift+Tab goes back', () => {
    fresh(); const seq = [S().tool]; for (let i = 0; i < 3; i++) { tap('next'); seq.push(S().tool); }
    eq(seq.join('>'), 'wash>cautery>banding>wash');
    tap('prev'); eq(S().tool, 'banding', 'Shift+Tab from Wash wraps to Banding');
    k('next', 'keydown'); for (let i = 0; i < 8; i++) k('next', 'keydown', true); k('next', 'keyup'); eq(S().tool, 'wash', 'held Tab advanced once');
  });
  test('Tab keeps normal focus behaviour outside play (intro, paused, debrief)', () => {
    D.reset(false); eq(k('next', 'keydown'), false, 'intro'); k('next', 'keyup');
    fresh(); k('p', 'keydown'); k('p', 'keyup'); eq(S().state, 'paused'); eq(k('next', 'keydown'), false, 'paused'); eq(S().tool, 'wash'); k('p', 'keydown'); k('p', 'keyup');
  });
  test('switching tools while Space is held stops the action and needs a fresh press', () => {
    fresh(); k('use', 'keydown'); tick(0.3); ok(S().washing, 'washing while held');
    tap('next'); tick(0.5); eq(S().tool, 'cautery'); ok(!S().cauteryOn && !S().washing, 'nothing active after switch'); eq(S().armed, false);
    k('use', 'keyup'); k('use', 'keydown'); tick(0.2); ok(S().cauteryOn, 'fresh press activates'); k('use', 'keyup');
  });
  test('releasing Space stops wash and cautery immediately', () => {
    fresh(); k('use', 'keydown'); tick(0.2); ok(S().washing); k('use', 'keyup'); tick(0.05); ok(!S().washing);
    tap('next'); k('use', 'keydown'); tick(0.2); ok(S().cauteryOn); k('use', 'keyup'); tick(0.05); ok(!S().cauteryOn);
  });
  test('wash clears blood and reveals the source while it is still bleeding', () => {
    fresh(); align(); tick(1.5); hold('use', 1.2); const s = S();
    ok(s.cover < 0.1, 'site cleared'); ok(s.stats.washRevealed, 'source revealed'); ok(s.bleeding, 'still bleeding'); ok(s.stats.washOnSrc > 1, 'wash on source');
  });
  test('cautery away from the source leaves it bleeding; on the source it controls after the contact interval', () => {
    fresh(); tap('next'); hold('use', 3);                      // lesion is far from the tip at the start
    ok(S().bleeding, 'still bleeding after off-target cautery'); ok(S().stats.cauteryOff > 2); ok(S().burns > 0, 'burn marks');
    align(); k('use', 'keydown'); tick(w.__duo.CONFIG.cauteryContactSec * 0.5); ok(S().bleeding, 'not yet controlled mid-interval');
    tick(w.__duo.CONFIG.cauteryContactSec * 0.7); k('use', 'keyup'); ok(!S().bleeding, 'controlled'); ok(S().controlledAt !== null);
  });
  test('breaking cautery contact decays progress', () => {
    fresh(); align(); tap('next'); k('use', 'keydown'); tick(0.8); ok(S().cauteryProg > 0.7); k('use', 'keyup'); tick(1); ok(S().cauteryProg < 0.1, 'progress decayed'); ok(S().bleeding);
  });
  test('banding gives the case-specific cue, does not treat, and allows an immediate switch', () => {
    fresh(); align(); tap('next'); tap('next'); eq(S().tool, 'banding'); k('use', 'keydown'); k('use', 'keyup'); tick(0.05);
    ok(/flat and fibrotic/.test(doc.getElementById('cue').textContent), 'cue text'); ok(S().bleeding); eq(S().stats.bandAttempts, 1); eq(S().stats.bandOnTarget, 1);
    tap('prev'); eq(S().tool, 'cautery', 'switch straight away');
  });
  test('overshoot then withdraw finds the lesion again', () => {
    fresh(); k('up', 'keydown'); tick(6); k('up', 'keyup'); tick(1); ok(!S().lesion.vis && S().lesion.d < 0.5, 'lesion passed'); eq(S().stats.overshoots, 1);
    k('down', 'keydown'); let g = 0; while (S().lesion.d < 2 && g++ < 400) tick(0.05); k('down', 'keyup'); tick(1); align(); ok(dist() <= 9, 'back under the tip');
  });
  test('full case with arrows + Space only: find, wash, cautery, wash, reinspect, safe sign-off', () => {
    fresh(); hold('up', 0.4); align(); hold('use', 1.0); ok(S().stats.washRevealed);
    tap('next'); hold('use', 2.2); ok(!S().bleeding, 'controlled');
    tap('prev'); eq(S().tool, 'wash'); hold('use', 1.8); tick(4.5);
    ok(S().stats.bestClearView >= 3, 'reinspected for >= 3 s'); k('enter', 'keydown'); k('enter', 'keyup');
    eq(S().state, 'ended'); eq(badge(), 'SAFE SIGN-OFF'); ok(!doc.getElementById('debrief').hidden);
    ok(!/Banding/.test(doc.getElementById('dbLegend').textContent), 'replay legend only lists tools used');
  });
  test('signing off while still bleeding is unsafe', () => {
    fresh(); tick(2); k('enter', 'keydown'); k('enter', 'keyup'); eq(S().state, 'ended'); eq(badge(), 'UNSAFE SIGN-OFF');
  });
  test('signing off after control without a clear re-inspection is not verified', () => {
    fresh(); align(); tap('next'); hold('use', 2.4); ok(!S().bleeding); k('enter', 'keydown'); k('enter', 'keyup'); eq(badge(), 'SIGN-OFF NOT VERIFIED');
  });
  test('uncontrolled bleeding ends in decompensation at the loss limit', () => {
    fresh(); tick(120); eq(S().state, 'ended'); eq(badge(), 'PATIENT UNSTABLE'); ok(S().loss >= w.__duo.CONFIG.lossLimitMl);
  });
  test('banding feedback appears only when banding was attempted; wash-only run adapts', () => {
    fresh(); align(); hold('use', 1); k('enter', 'keydown'); k('enter', 'keyup');
    const fb = doc.getElementById('dbFeedback').textContent; ok(/Wash/.test(fb) && !/Banding/.test(fb), 'no banding line'); ok(/never used cautery/.test(fb), 'cautery hint');
  });
  test('pause freezes the bleed; resume needs a fresh Space press', () => {
    fresh(); tick(1); k('p', 'keydown'); k('p', 'keyup'); eq(S().state, 'paused'); const t0 = S().t, l0 = S().loss; tick(2); eq(S().t, t0); eq(S().loss, l0);
    k('p', 'keydown'); k('p', 'keyup'); eq(S().state, 'play'); eq(S().armed, false);
  });
  test('instant retry with R restarts the whole case; Space on the debrief does not', () => {
    fresh(); tick(1); k('enter', 'keydown'); k('enter', 'keyup'); eq(S().state, 'ended');
    k('use', 'keydown'); k('use', 'keyup'); eq(S().state, 'ended', 'Space ignored');
    k('r', 'keydown'); k('r', 'keyup'); const s = S(); eq(s.state, 'play'); eq(s.t, 0); eq(s.z, D.CASE.start.z); ok(s.bleeding); eq(s.loss, 0); eq(s.controlledAt, null); eq(s.tool, 'wash'); ok(doc.getElementById('debrief').hidden);
  });


  test('CASE 1 varices: wash reveals it, banding (Tab, Tab, Space) controls it, wash, reinspect, safe sign-off', () => {
    fresh(0); align(); hold('use', 1.0); ok(S().stats.washRevealed, 'revealed'); ok(/varix/.test(doc.getElementById('cue').textContent));
    tap('next'); tap('next'); eq(S().tool, 'banding'); eq(S().bands, 6); k('use', 'keydown'); k('use', 'keyup'); tick(0.1);
    ok(!S().bleeding, 'bleeding stopped by the band'); eq(S().controlledBy, 'banding'); eq(S().bands, 5); eq(S().stats.bandsUsed, 1);
    tap('prev'); tap('prev'); eq(S().tool, 'wash'); hold('use', 1.8); tick(4.5);
    ok(S().stats.bestClearView >= 3, 'reinspected'); k('enter', 'keydown'); k('enter', 'keyup'); eq(badge(), 'SAFE SIGN-OFF');
    const fb = doc.getElementById('dbFeedback').textContent; ok(/band on the varix/.test(fb) && /Bleeding stopped/.test(fb), 'banding feedback'); ok(!/Cautery/.test(fb), 'no cautery line when unused');
  });
  test('CASE 1 varices: cautery is the wrong tool: it never controls the bleed and says why', () => {
    fresh(0); align(); tap('next'); eq(S().tool, 'cautery'); hold('use', 4); ok(S().bleeding, 'still bleeding'); ok(S().stats.cauteryWrong > 3, 'counted as wrong-tool contact');
    ok(/not for varices/.test(doc.getElementById('cue').textContent), 'cue'); k('enter', 'keydown'); k('enter', 'keyup'); ok(/does not belong on a varix/.test(doc.getElementById('dbFeedback').textContent));
  });
  test('CASE 1 varices: a band fired away from the varix is wasted; the cap runs out after six', () => {
    fresh(0); tap('next'); tap('next'); for (let i = 0; i < 6; i++) { k('use', 'keydown'); k('use', 'keyup'); tick(1.0); }
    eq(S().stats.bandsWasted, 6); eq(S().bands, 0); ok(S().bleeding); eq(S().burns, 6, 'six nodules on normal mucosa');
    k('use', 'keydown'); k('use', 'keyup'); ok(/No bands left/.test(doc.getElementById('cue').textContent), 'out of bands');
  });
  test('CASE 2 gastric ulcer: wash, cautery on the ulcer, wash, reinspect, safe sign-off; banding gives the gastric cue', () => {
    fresh(1); align(); tap('next'); tap('next'); k('use', 'keydown'); k('use', 'keyup'); tick(0.05);
    ok(/gastric ulcer is a flat crater/.test(doc.getElementById('cue').textContent), 'gastric banding cue'); ok(S().bleeding); eq(S().bands, 6, 'no band used');
    tap('prev'); tap('prev'); eq(S().tool, 'wash'); hold('use', 1.0); ok(S().stats.washRevealed, 'revealed'); tap('next'); hold('use', 2.2); ok(!S().bleeding, 'controlled'); eq(S().controlledBy, 'cautery');
    tap('prev'); hold('use', 1.8); tick(4.5); k('enter', 'keydown'); k('enter', 'keyup'); eq(badge(), 'SAFE SIGN-OFF');
  });
  test('cases can be switched from the intro with 1/2/3 and from the debrief with N and the pills', () => {
    D.loadCase(0, false); k('use', 'keydown'); k('use', 'keyup'); eq(S().state, 'play'); k('enter', 'keydown'); k('enter', 'keyup'); eq(S().state, 'ended');
    const key = ch => { w.dispatchEvent(new w.KeyboardEvent('keydown', { key: ch, bubbles: true, cancelable: true })); w.dispatchEvent(new w.KeyboardEvent('keyup', { key: ch, bubbles: true, cancelable: true })); };
    key('n'); eq(S().caseIdx, 1); eq(S().state, 'play'); k('enter', 'keydown'); k('enter', 'keyup'); key('3'); eq(S().caseIdx, 2); eq(S().state, 'play');
    k('enter', 'keydown'); k('enter', 'keyup'); doc.querySelector('#dbPills .pill[data-case="0"]').click(); eq(S().caseIdx, 0); eq(S().state, 'play');
    D.loadCase(1, false); key('3'); eq(S().caseIdx, 2); eq(S().state, 'intro', 'intro keeps waiting for Space');
  });

  const failed = results.filter(r => !r.ok).length;
  document.getElementById('sum').textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} tests passed`;
  document.getElementById('sum').style.color = failed ? '#ff5d57' : '#5fd38d';
  document.getElementById('out').innerHTML = results.map(r => `<div class="t ${r.ok ? '' : 'fail'}">${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : `<small>${r.err}</small>`}</div>`).join('');
});
</script>
</body>
</html>
